version: "0.5"

processes:
  epmd:
    command: epmd -port 4369

  postgres-init:
    command: |
      if [ ! -d "$PGDATA" ]; then
        initdb --username=postgres --auth=trust
      fi
    # availability:
    #   exit_on_end: true

  postgres:
    command: postgres -k "$PGDATA"
    depends_on:
      postgres-init:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: pg_isready -h localhost
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 20

  circus-init:
    command: |
      set -eu
      psql --dbname=postgres --set=ON_ERROR_STOP=1 <<'SQL'
      SELECT format('CREATE DATABASE %I', 'circus_dev')
      WHERE NOT EXISTS (
        SELECT FROM pg_database WHERE datname = 'circus_dev'
      ) \gexec
      SQL
      circusctl migrate up postgresql://postgres@127.0.0.1/circus_dev
    depends_on:
      postgres:
        condition: process_healthy

  circus:
    command: circus-server --config .services/circus/circus.toml
    depends_on:
      circus-init:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: circusctl admin status
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 20
