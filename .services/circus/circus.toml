[database]
url = "postgresql://postgres@127.0.0.1/circus_dev"

[server]
host = "127.0.0.1"
port = 3000
allowed_url_schemes = ["https", "git", "ssh", "file"]
webhook_secret_encryption_key_file = ".dev-circus-webhook-encryption-key"

[[declarative.api_keys]]
name = "sower-development"
key_file = ".dev-circus-api-key"
role = "admin"

[logs]
log_dir = ".services/circus/data/logs"

[evaluator]
poll_interval = 5
restrict_eval = false

[queue_runner]
workers = 1
local_systems = []

[queue_runner.rpc]
bind = "127.0.0.1:8443"
allow_plaintext = true
cache_substituter = "http://127.0.0.1:3000/nix-cache/"

[cache_upload]
enabled = true
store_uri = "s3://circus-cache"
fail_build_on_upload_error = true

[cache_upload.s3]
region = "us-east-1"
endpoint_url = "http://127.0.0.1:9000"
use_path_style = true
secret_access_key_file = ".dev-s3-secret-key"

[agent]
name = "sower-development"
runner_url = "circus://127.0.0.1:8443"
systems = []
max_jobs = 1
work_dir = ".services/circus/data/agent"
rootless = true

[signing]
enabled = true
key_file = ".dev-circus-signing-key"

[cache]
enabled = true
cache_url = "http://127.0.0.1:3000/nix-cache/"
